# Automatic suspend policy. monolithd is White Monolith's only suspend authority once
# `suspend = true` (phase 3); Steam's and KDE's own suspend timers must be off by then.
# Read by monolithd sleep-policy, which re-reads this file every minute.
version = 1

# Suspend after this many minutes with no activity. The clock restarts whenever any
# activity ends: a job, keyboard/mouse/gamepad input, music, a remote desktop or
# streaming session, or a wake.
quiet_minutes = 120

# How long the pre-sleep cue shows before suspending (phase 3).
cue_minutes = 5

# false: observe only, logging when it would suspend. true: show the pre-sleep cue for
# cue_minutes, then suspend. Re-read every minute, so this is the cutover and the rollback.
suspend = true
