# Per-zone color calibration, applied at the very end of the output path, just
# before colors are written to OpenRGB. It corrects the LEDs' own color balance
# so a scene authored as (255, 255, 255) actually looks white; scenes stay in
# nominal color and never need to know about the hardware.
#
# gain = [R, G, B], each 0.0 to 1.0 (1.0 leaves that channel untouched; it can
# only reduce a channel, never boost it). Values are multiplied in DMX space and
# rounded. A zone that is not listed runs at [1, 1, 1].
#
# This file is re-read about twice a second while the lighting stack runs. A
# file that fails validation is ignored (the previous gains stay in force) and
# the reason is logged. Deleting the file returns every zone to [1, 1, 1].
#
# Zone names match scene-layout.toml: ram, rog_eye, strip.

version = 1

# RAM and the eye were judged neutral white and in agreement with each other at
# unity gain (2026-09-21). No zone is canonical: every zone, RAM included, is
# calibrated until all whites agree and read neutral. RAM's LED casings may yellow
# with age; re-tune this line when they do.
[zones.ram]
gain = [1.0, 1.0, 1.0]

# Judged neutral and matching RAM at unity gain (2026-09-21), using the
# reference_white_eye Scene (Function 116) beside `progress ram 0`.
[zones.rog_eye]
gain = [1.0, 1.0, 1.0]

# Tuned by eye on 2026-09-21. The strip's blue is weak and its flexible casing has
# yellowed with age (a blue-absorbing filter), so its white needs red and green cut
# hard: 0.18 / 0.18 is DMX 46 / 46 at full white. With all 70 LEDs white its color
# agrees with RAM and the eye at about the same brightness (dimmer only
# than its own uncalibrated baseline). Trail: 0.19 / 0.18 (48 / 46) read
# slightly green at 35 white LEDs and reddish at 70; 49 / 46 and 45 / 43 read
# slightly red; 42 / 40 red. The strip is also uneven along its length (the casing
# has yellowed unevenly, or its LEDs are mixed bins), which one gain per zone cannot
# fix; a per-pixel map would (deferred to a later pass). The owner's diagnosis is
# that the strip's red and green LEDs are overpowered from the factory, which is why
# they must be cut hard. Expect to re-tune this line over the years.
[zones.strip]
gain = [0.18, 0.18, 1.0]
