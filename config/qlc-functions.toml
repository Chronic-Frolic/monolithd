# Named ambient sets: the zone functions that make up one ambient look. A set is started
# together (start_set) so its chasers stay in phase, and a member returning later rejoins
# at the next cycle boundary. Sets are data; which one is selected is controller state.
[[ambient_sets]]
name = "deep_violet"
functions = ["ambient_ram", "ambient_eye", "ambient_strip"]

# "Fire" (2026-09-26): a second base look, built like violet plasma in ember reds and
# oranges; switch with `monolithd event ambient fire`.
[[ambient_sets]]
name = "fire"
functions = ["fire_ram", "fire_eye", "fire_strip"]

