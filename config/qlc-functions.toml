# Progress-capable zones register a contiguous step range: Function ID is
# `first_id + completed`, for completed in 0..=total. These steps are produced
# by the planned offline authoring tool; they are never computed at runtime.
[[progress]]
name = "progress_ram"
zone = "ram"
label = "RAM"
first_id = 0
total = 32
# Physical fill order: fixture IDs in the order they light, measured 2026-09-26 from the
# static steps above and stored so the steps can become animated.
order = [15, 14, 13, 12, 11, 10, 9, 8, 31, 30, 29, 28, 27, 26, 25, 24, 7, 6, 5, 4, 3, 2, 1, 0, 23, 22, 21, 20, 19, 18, 17, 16]

