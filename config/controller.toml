# Controller policy: what plays by default and how progress zones are allocated.
# What each name means is data in qlc-functions.toml (ambient sets, progress families).

version = 1

# The ambient set that plays on every zone that is not showing a job.
default_ambient = "deep_violet"

# Zones that can show a job's progress, in allocation order: the first job takes the
# first zone, the second takes the next, and any further job waits. The eye is not
# listed: it is reserved for ambient and warnings.
progress_zones = ["ram", "strip"]

# A completed job holds its bar at 100% this long before the zone returns to ambient.
complete_hold_seconds = 15

# How often the controller compares the plant with what it wants, besides reacting
# at once to every request.
poll_interval_ms = 1000

# Zones a warning claims when raised with no explicit --zones. Every zone can author
# warning content since 2026-09-22 (see the intake contract) -- this is what actually
# picks where it's shown. The whole machine since 2026-09-26 (owner), with the animated
# amber march authored that day.
warning_zones = ["ram", "rog_eye", "strip"]

# Zones the automatic "a job is running somewhere" indicator claims. Same shape as
# warning_zones. The whole machine since 2026-09-27 (owner): the working look is a
# whole-machine look. A progress zone showing a job's own bar keeps the bar; the
# indicator covers every other listed zone.
working_zones = ["ram", "rog_eye", "strip"]

# What an animated bar shows on its empty side: "base" (the ambient look itself, so the
# bar is part of the base look) or "working" (the working look chosen below). The lit
# side is always the ambient set's own Full look.
progress_empty = "base"

# The working look, for the job-running indicator above and a working bar's empty side:
# "violet" (violet plasma's own motion with white glitter) or "white" (white glinting in
# the base look's own colors). Two sister looks, 2026-09-26.
working_look = "violet"
