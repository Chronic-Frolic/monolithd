[package]
name = "monolithd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
libc = "0.2.189"
quick-xml = "0.42.0"
sacn = { package = "x39-sacn", version = "0.2.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
toml = "1.1.6"
