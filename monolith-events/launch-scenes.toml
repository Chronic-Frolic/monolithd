# Launch-scene policy. Steam launch observation supplies shortcut App IDs.
# Higher-priority controller states still override any launch scene.

[default]
scene = "pretty_scene_1"

[scenes.pretty_scene_1]
profile = "profiles/scenes/pretty-scene-1.json"
requires_plugins = ["OpenRGB Effects Plugin", "OpenRGB Visual Map Plugin"]

[steam_launch]
# Per-shortcut overrides:
# "292030" = "another_scene"
# "3546570475" = "off"
